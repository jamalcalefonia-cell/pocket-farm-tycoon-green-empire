<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#214e38" />
    <meta name="description" content="لعبة إدارة مزرعة عربية: ازرع واحصد وتاجر وابنِ إمبراطوريتك الخضراء، مع حفظ محلي." />
    <title>Pocket Farm Tycoon: Green Empire</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/share/icon.png" />
  </head>
  <body>
    <div id="boot-loader" class="boot-loader" aria-live="polite">
      <img src="./assets/share/icon.png" alt="الإمبراطورية الخضراء" />
      <span class="eyebrow">POCKET FARM TYCOON</span>
      <h1>مزرعتك في طريقها إلى الحياة</h1>
      <div class="boot-progress"><i id="boot-progress-bar"></i></div>
      <p id="boot-status">نجهّز الحقول والمخزن…</p>
      <small id="boot-time">الوقت المنقضي: 0 ث</small>
      <small>يتم التحميل مرة واحدة، ثم يمكنك اللعب دون اتصال بعد اكتمال التخزين.</small>
    </div>
    <div id="app"></div>
    <noscript>يرجى تفعيل JavaScript لتشغيل اللعبة. لا تحتاج إلى حساب.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
